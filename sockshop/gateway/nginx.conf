# Reverse proxy in front of the Sock Shop front-end. Its only job for ZombieShield is to write
# one JSON line per request. The client address is logged so the backend can pseudonymise it;
# query strings are logged so the payload classifier can inspect values before they are discarded.
worker_processes 1;
events { worker_connections 1024; }

http {
    map $http_authorization$cookie_logged_in $zs_has_auth { "" "0"; default "1"; }

    log_format zs_json escape=json '{"ts":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
                                   '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
                                   '"latency":$request_time,"host":"front-end","service":"front-end","auth":"$zs_has_auth"}';
    access_log /var/log/gateway/access.log zs_json;

    upstream sockshop_front_end { server front-end:8079; }

    server {
        listen 80;
        # Gateway rules written by the team's remediation stage (empty by default).
        include /etc/nginx/zombieshield/*.conf;

        location / {
            proxy_pass http://sockshop_front_end;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
